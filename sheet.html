<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>Ficha DSO</title><link rel="stylesheet" href="./sheet.css"></head><body>
<main class="sheet-shell"><header class="sheet-top"><div class="top-brand"><img src="./icon.svg"><div><span>DSO SYSTEM // REGISTRO DE AGENTE</span><strong id="topName">FICHA DE AGENTE</strong></div></div><div class="top-actions"><span id="saveState">SINCRONIZADO</span><button id="saveBtn">SALVAR</button><button id="closeBtn" class="close">×</button></div></header>
<section class="hero"><label class="portrait-large"><img id="portraitPreview" class="hidden"><span id="portraitMark">◇</span><input id="portrait" placeholder="URL do retrato"></label><div class="identity-grid"><label class="wide"><span>NOME DO AGENTE</span><input id="name"></label><label><span>CLASSE</span><select id="class"></select></label><label><span>ORIGEM</span><input id="origin" list="origins"></label><label><span>TRILHA</span><input id="trail" list="trails"></label><label><span>NEX</span><div class="unit-input"><input id="nex" type="number" min="0" max="100"><b>%</b></div></label><label><span>NÍVEL</span><input id="level" type="number" min="1" max="99"></label><label><span>PATENTE</span><input id="patent"></label></div></section>
<section class="resource-strip"><label class="resource pv"><span>PV</span><div><input id="pv" type="number"><b>/</b><output id="pvMax">0</output></div></label><label class="resource pe"><span>PE</span><div><input id="pe" type="number"><b>/</b><output id="peMax">0</output></div></label><label class="resource san"><span>SAN</span><div><input id="san" type="number"><b>/</b><output id="sanMax">0</output></div></label><div class="derived"><span>DEFESA <b id="defense">10</b></span><span>ESQUIVA <b id="dodge">10</b></span><span>DT RITUAL <b id="ritualDt">10</b></span></div></section>
<nav class="tabs"><button class="active" data-tab="geral">GERAL</button><button data-tab="pericias">PERÍCIAS</button><button data-tab="combate">COMBATE</button><button data-tab="inventario">INVENTÁRIO</button><button data-tab="habilidades">HABILIDADES</button><button data-tab="rituais">RITUAIS</button><button data-tab="bio">BIOGRAFIA</button></nav>
<section id="tab-geral" class="tab-panel active"><div class="section-title"><span>ATRIBUTOS</span><i></i></div><div id="attributes" class="attributes"></div><div class="section-title"><span>STATUS DERIVADOS</span><i></i></div><div id="derivedGrid" class="derived-grid"></div></section>
<section id="tab-pericias" class="tab-panel"><div class="skills-head"><span>PERÍCIA</span><span>ATR.</span><span>TREINO</span><span>OUTROS</span><span></span></div><div id="skills" class="skills"></div></section>
<section id="tab-combate" class="tab-panel"><div class="form-grid"><label><span>BÔNUS DE DEFESA</span><input id="defBonus" type="number"></label><label><span>DESLOCAMENTO BASE</span><input id="movement" type="number"></label><label><span>BÔNUS DE DESLOCAMENTO</span><input id="movementBonus" type="number"></label><label><span>PONTOS DE PRESTÍGIO</span><input id="prestige" type="number"></label><label><span>BÔNUS PV</span><input id="pvBonus" type="number"></label><label><span>BÔNUS PE</span><input id="peBonus" type="number"></label><label><span>BÔNUS SAN</span><input id="sanBonus" type="number"></label></div></section>
<section id="tab-inventario" class="tab-panel"><div class="list-toolbar"><span>ITENS DO AGENTE</span><button data-add="inventory">+ ITEM</button></div><div id="inventoryList" class="collection"></div></section>
<section id="tab-habilidades" class="tab-panel"><div class="list-toolbar"><span>PODERES E HABILIDADES</span><button data-add="abilities">+ HABILIDADE</button></div><div id="abilityList" class="collection"></div></section>
<section id="tab-rituais" class="tab-panel"><div class="list-toolbar"><span>RITUAIS</span><button data-add="rituals">+ RITUAL</button></div><div id="ritualList" class="collection"></div></section>
<section id="tab-bio" class="tab-panel"><label class="long-text"><span>BIOGRAFIA</span><textarea id="biography"></textarea></label><label class="long-text"><span>OBJETIVOS</span><textarea id="goals"></textarea></label></section>
<div id="locked" class="locked hidden">MODO DE CONSULTA // VOCÊ NÃO POSSUI CONTROLE DESTA FICHA</div><div id="loading" class="loading">CARREGANDO REGISTRO…</div><datalist id="origins"></datalist><datalist id="trails"></datalist><div id="toast" class="toast hidden"></div></main><script type="module" src="./sheet.js"></script></body></html>
